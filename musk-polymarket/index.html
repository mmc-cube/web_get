<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musk 发文市场</title>
<style>
:root{--bg:#f6f7f2;--panel:#fff;--ink:#20231f;--muted:#697065;--line:#d9ddd2;--accent:#0f766e;--violet:#7c3aed;--bad:#b91c1c;--good:#15803d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{width:min(1180px,calc(100vw - 28px));margin:0 auto;padding:22px 0 40px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:8px 0 18px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:26px;line-height:1.15}.sub,#status{color:var(--muted);font-size:13px}.sub{margin-top:6px}.toolbar{display:flex;gap:8px;justify-content:flex-end}button{height:36px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:#fff;font:inherit;padding:0 12px;cursor:pointer;font-weight:650}#status{min-height:26px;margin:14px 0}.error{color:var(--bad)!important}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat,.panel,.market{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stat{padding:14px;min-height:86px}.stat span,.metric span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:8px;font-size:24px;line-height:1}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;margin-top:14px}.panel{padding:14px}h2{margin:0 0 12px;font-size:16px}.market-list{display:grid;gap:12px}.market{padding:14px}.market-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.market-title{margin:0;font-size:15px;line-height:1.35}a{color:var(--accent);text-decoration:none;font-weight:650}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.metric{min-height:58px;border:1px solid var(--line);border-radius:7px;padding:9px;background:#fbfcf8}.metric strong{display:block;margin-top:5px;font-size:17px}.ranges{display:grid;gap:7px;margin-top:12px}.range{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;align-items:center;min-height:38px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px}.price{color:var(--violet);font-weight:760;text-align:right}.prob{color:var(--muted);text-align:right}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:650}.pill{display:inline-flex;align-items:center;height:24px;border-radius:999px;padding:0 9px;background:#eef2e8;color:var(--muted);font-size:12px;font-weight:650}.good{color:var(--good)}.empty{min-height:180px;display:grid;place-items:center;color:var(--muted)}@media(max-width:860px){header,.toolbar{display:grid;justify-content:stretch}.stats,.layout,.metrics{grid-template-columns:1fr}.range{grid-template-columns:1fr 78px 78px}}
</style>
</head>
<body>
<main>
<header><div><h1>Musk 发文市场</h1><div class="sub" id="subtitle">读取中</div></div><div class="toolbar"><button id="refreshBtn">刷新</button></div></header>
<div id="status"></div>
<section class="grid stats" id="stats"></section>
<section class="layout"><div class="panel"><h2>市场</h2><div class="market-list" id="markets"><div class="empty">加载中</div></div></div><aside class="panel"><h2>刷新记录</h2><div id="runs"></div></aside></section>
</main>
<script>
const $=id=>document.getElementById(id),statusEl=$("status"),subtitle=$("subtitle"),statsEl=$("stats"),marketsEl=$("markets"),runsEl=$("runs");
async function loadJson(path){const r=await fetch(path+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(path+" "+r.status);const j=await r.json();if(!j.ok)throw Error(j.error||path);return j.data??j}
const num=(v,d=0)=>Number.isFinite(Number(v))?Number(v).toLocaleString(undefined,{maximumFractionDigits:d}):"-";
const time=v=>{if(!v)return"-";const d=new Date(v);return Number.isNaN(d.getTime())?"-":d.toLocaleString()};
const pct=v=>Number.isFinite(Number(v))?Math.round(Number(v)*100)+"%":"-";
function stat(k,v,cls=""){return`<div class="stat"><span>${k}</span><strong class="${cls}">${v}</strong></div>`}
function renderStats(s,ms){statsEl.innerHTML=[stat("可计入推文",num(s.countable),"good"),stat("原始推文",num(s.tweets)),stat("活跃市场",num(ms.filter(m=>m.is_started&&!m.is_ended).length)),stat("最近推文",time(s.latest_created_at_utc))].join("")}
function renderRuns(s){const rows=(s.recent_runs||[]).slice(0,8);runsEl.innerHTML=rows.length?`<table><thead><tr><th>时间</th><th>状态</th><th>更新</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${time(r.started_at)}</td><td><span class="pill">${r.status||"-"}</span></td><td>${num(r.updated_count)} / ${num(r.new_count)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">暂无记录</div>`}
function renderMarket(m){const rem=Number(m.remaining_hours);const ranges=[['条件中位',m.conditional_final_median,'历史匹配'],['P25',m.conditional_final_p25,'条件'],['P75',m.conditional_final_p75,'条件'],['P90',m.conditional_final_p90,'条件']].filter(x=>x[1]!=null).map(x=>`<div class="range"><strong>${x[0]}</strong><span class="price">${num(x[1])}</span><span class="prob">${x[2]}</span></div>`).join("")||`<div class="range"><strong>暂无条件预测</strong><span></span><span></span></div>`;return`<article class="market"><div class="market-head"><h3 class="market-title">${m.title||m.tracking_id||"Untitled"}</h3>${m.market_link?`<a href="${m.market_link}" target="_blank" rel="noreferrer">Polymarket</a>`:""}</div><div class="metrics"><div class="metric"><span>当前</span><strong>${num(m.current_count)}</strong></div><div class="metric"><span>进度</span><strong>${pct(m.progress_pct)}</strong></div><div class="metric"><span>剩余</span><strong>${Number.isFinite(rem)?Math.max(0,Math.round(rem))+"h":"-"}</strong></div><div class="metric"><span>24h 速率</span><strong>${num(m.rate_24h_per_day,1)}/d</strong></div></div><div class="ranges">${ranges}</div></article>`}
async function refresh(){statusEl.textContent="同步中";statusEl.className="";marketsEl.innerHTML='<div class="empty">加载中</div>';try{const [s,mp]=await Promise.all([loadJson("./data/status.json"),loadJson("./data/markets.json")]);const ms=mp.markets||[];subtitle.textContent=`静态同步 · ${time(mp.generated_at_utc||mp.latest_xtracker_sync)}`;renderStats(s,ms);renderRuns(s);marketsEl.innerHTML=ms.map(renderMarket).join("")||'<div class="empty">暂无市场</div>';statusEl.textContent="已更新页面缓存 "+new Date().toLocaleTimeString()}catch(e){statusEl.textContent="读取失败："+e.message;statusEl.className="error";marketsEl.innerHTML='<div class="empty">无法读取数据</div>'}}
$("refreshBtn").onclick=refresh;refresh();setInterval(refresh,60000);
</script>
</body>
</html>
